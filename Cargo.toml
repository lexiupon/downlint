[package]
name = "downlint"
version = "0.1.0"
edition = "2024"
description = "A Markdown LSP and CLI diagnostic tool"
license = "MIT"
readme = "README.md"

[lib]
name = "downlint"
path = "src/lib.rs"

[[bin]]
name = "downlint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
comrak = "=0.52.0"
globset = "0.4.18"
ignore = "0.4.24"
lsp-types = "0.97.0"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-normalization = "0.1.25"
url = "2.5.7"

[dev-dependencies]
criterion = "0.5.1"
insta = { version = "1.43.2", features = ["json"] }
tempfile = "3.14"
